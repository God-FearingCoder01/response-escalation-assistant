name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rea
          POSTGRES_PASSWORD: rea
          POSTGRES_DB: rea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rea -d rea_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://rea:rea@localhost:5432/rea_test
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      PIN_PEPPER: ci-only-pin-pepper-0123456789abcdef
      SUPERADMIN_BOOTSTRAP_PIN: "7314"
      AGENT_BOOTSTRAP_PIN: "5826"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest backend/tests
